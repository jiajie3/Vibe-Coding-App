# Render Blueprint — deploys FRCDE as one service serving both the console and
# the API.
#
# Point Render at this repository and it reads this file; no dashboard clicking.
#
# Two things here are load-bearing:
#
#   rootDir     The service builds and runs inside frcde/, but Render clones the
#               whole repository — which matters because the server imports the
#               coverage engine and deadline rules from cfpi/src/core, and reads
#               the seed data from contracts/. Deploying frcde/ alone would fail
#               at startup on a missing module.
#
#   NODE_VERSION  The server runs TypeScript directly, relying on Node's native
#               type stripping. That needs Node 22.6+, and Render's default is
#               older than we can assume.
#
# Free plan note: no persistent disk, so data/db.json and uploaded photographs
# are wiped on every deploy and restart. The store reseeds itself to five due
# drains, so a reset is tidy rather than broken — but colleagues' inspections do
# not survive. Attach a disk on a paid plan if they need to.

services:
  - type: web
    name: frcde
    runtime: node
    rootDir: frcde
    plan: free
    # --include=dev because the build needs TypeScript and Vite, which are
    # devDependencies; Render may otherwise install production deps only.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /v1/healthz
    envVars:
      - key: NODE_VERSION
        value: "24.19.0"
      - key: NODE_ENV
        value: production

      # Override the seeded demo passwords. They are hashed either way, but the
      # defaults are published in the README — fine on a laptop, not on a public
      # URL. `generateValue` lets Render mint one and show it in the dashboard;
      # replace with `value:` if you would rather choose it yourself.
      #
      # These are read when the database is first seeded. Changing one later
      # takes effect on the next reseed, which on the free plan is every deploy.
      - key: FRCDE_SUPERVISOR_PASSWORD
        generateValue: true
      - key: FRCDE_INSPECTOR_PASSWORD
        generateValue: true
      - key: FRCDE_SITI_PASSWORD
        generateValue: true

      # Slack follow-ups. Absent, the integration simulates every send and logs
      # what it would have posted, so the console works unchanged and a demo
      # needs no workspace at all. See docs/slack.md.
      #
      # `sync: false` means Render prompts for these rather than storing them in
      # this file — a bot token in a public repository is a token someone else
      # can post to your channels with.
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
